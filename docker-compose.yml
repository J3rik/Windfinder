# Windfinder deployment.
#
#   1. Set the SMTP_* values on the alert-service below.
#   2. Ensure a users.json file exists (see the volume note).
#   3. docker compose up -d              # dashboard only
#      docker compose --profile alerts up -d   # dashboard + mail worker
#
# Profile data is bind-mounted from the host so it survives rebuilds.

services:
  # The dashboard. It only reads and writes profiles - it never sends mail,
  # so it deliberately gets no SMTP credentials.
  kite-forecast:
    build: .
    image: windfinder:latest
    container_name: windfinder-app
    ports:
      - "8501:8501"
    volumes:
      # Host file so profiles persist across container updates. If this file is
      # missing, Docker creates a DIRECTORY with that name and profile saving
      # fails, so create it first:  echo '{}' > users.json
      - ./users.json:/app/users.json
    restart: unless-stopped

  # The alert worker - the only component that sends mail, so it is the only
  # one holding SMTP credentials. Enable with:
  #   docker compose --profile alerts up -d
  alert-service:
    build: .
    image: windfinder:latest
    container_name: windfinder-alerts
    command: ["python", "alert_service.py"]
    volumes:
      - ./users.json:/app/users.json
    environment:
      # --- Mail (required for sending) --------------------------------------
      - SMTP_SERVER=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@example.com
      - SMTP_PASSWORD=your-secret-password
      - SMTP_SENDER=your-email@example.com
      # --- Optional ---------------------------------------------------------
      # Ports tried if SMTP_PORT is unreachable (firewall / provider block).
      - SMTP_FALLBACK_PORTS=25,465
      # Set to 0 for implicit TLS on port 465.
      - SMTP_STARTTLS=1
    restart: unless-stopped
    profiles:
      - alerts
